plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.duckaiwebview'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.duckaiwebview"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0' // Header bypass ke liye zaroori
}
